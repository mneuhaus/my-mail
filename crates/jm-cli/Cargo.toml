[package]
name = "jm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jm"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
chrono.workspace = true
# Never enable jm-core's `send` feature here: the CLI and its MCP server only prepare drafts.
jm-core.workspace = true
clap = { version = "4", features = ["derive", "env"] }
