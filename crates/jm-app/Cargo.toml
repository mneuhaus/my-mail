[package]
name = "jm-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "just-mail"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
jm-core = { workspace = true, features = ["send"] }
gpui-kit = "0.7"
sys-locale = "0.3"
wry = { version = "0.57", default-features = false }
futures = "0.3"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "webp", "bmp"] }
